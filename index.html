/* ---- แมวทำความสะอาด ---- */
.stage{position:relative;height:172px;border-radius:22px;overflow:hidden;background:linear-gradient(#dbeafe 0%,#fce7f3 78%);border:1px solid var(--line);box-shadow:0 4px 14px rgba(124,58,237,.12)}

.stage .floor{position:absolute;left:0;right:0;bottom:0;height:36px;background:repeating-linear-gradient(90deg,#fde68a 0 40px,#fcd9a0 40px 80px);border-top:3px solid #f5c26b}
.stage .cloud{position:absolute;height:16px;width:56px;border-radius:999px;background:#fff;opacity:.85;animation:drift 46s linear infinite}
.stage .cloud::after{content:"";position:absolute;left:12px;top:-9px;width:26px;height:20px;border-radius:50%;background:#fff}
@keyframes drift{from{left:-12%}to{left:108%}}
.stage .web{position:absolute;right:6px;top:0;width:86px;height:86px;z-index:1;animation:webfade 22s ease-in-out -10s infinite}

.stage .sp{position:absolute;z-index:1;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.cat{position:absolute;bottom:24px;width:84px;height:76px;z-index:2;left:var(--x0);animation:walk var(--d) ease-in-out var(--dl) infinite}
.cat .flip{position:relative;width:100%;height:100%;transform:scaleX(var(--f0));animation:flip var(--d) linear var(--dl) infinite}
@keyframes walk{0%{left:var(--x0)}28%,54%{left:var(--x1)}82%,100%{left:var(--x0)}}
@keyframes flip{0%,54%{transform:scaleX(var(--f0))}54.2%,99.8%{transform:scaleX(var(--f1))}100%{transform:scaleX(var(--f0))}}
.catsvg{width:100%;height:100%;overflow:visible;animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag 1s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.leg{animation:stepl .35s ease-in-out infinite alternate}.leg.l2{animation-delay:.17s}
@keyframes stepl{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.tool{position:absolute;width:48px;height:64px;left:62%;bottom:-8px;overflow:visible}
.tool.mop{animation:mop var(--d) ease-in-out var(--dl) infinite}
.tool.broom{transform-origin:70% 0;animation:broom var(--d) ease-in-out var(--dl) infinite}

        ${ok.length ? `<div><h3 class="text-sm font-semibold mb-1" style="color:var(--done)">ไม่พบสิ่งผิดปกติ (${ok.length} จุด)</h3>${ok.map(r => `<div class="flex justify-between gap-2 text-sm py-1" style="border-bottom:1px solid var(--line)"><span>✓ ${esc(ptKey(r))} <span class="text-xs" style="color:var(--muted)">— ${esc(r.detail && r.detail !== "-" ? r.detail : "ตรวจปกติ / ไม่พบสิ่งผิดปกติ")}</span></span><span style="color:var(--muted)">${esc(r.inspector)}</span></div>`).join("")}</div>` : ""}</div>`;
    }
    const hdr = editDate === d ? `<div class="p-4 flex flex-wrap items-center gap-2"><input type="date" id="dateIn" class="inp" style="width:auto" value="${d}" aria-label="วันที่ใหม่"><button class="btn" data-act="datesave" data-d="${d}">บันทึกวันที่</button><button class="btn2" data-act="datecancel">ยกเลิก</button></div>`
      : `<div class="p-4 flex flex-wrap items-center justify-between gap-2"><div class="flex items-center gap-2"><button class="px-1" data-act="day" data-d="${d}" aria-expanded="${isOpen || filtering}" aria-label="ย่อ/ขยาย">${isOpen || filtering ? "▾" : "▸"}</button><button class="text-base font-bold underline decoration-dotted" data-act="dateedit" data-d="${d}" title="คลิกเพื่อแก้ไขวันที่ของกลุ่มนี้">${fmtD(d)} <span class="text-xs">✎</span></button></div><button class="text-left" data-act="day" data-d="${d}"><span class="text-sm">ตรวจ ${all.length} จุด · พบปัญหา <b style="color:${abn.length ? "var(--bad)" : "var(--done)"}">${abn.length}</b> (${pct(abn.length, all.length)}%)${open ? ` · <b style="color:var(--wait)">ค้าง ${open}</b>` : abn.length ? ` · <b style="color:var(--done)">ปิดครบ</b>` : ""}</span></button></div>`;

  }).join("");
  const nat = (a, b) => String(a).localeCompare(String(b), "th", {numeric:true}), uniq = k => [...new Set(recs.map(r => r[k]).filter(v => v && v !== "-"))].sort(nat), zs = uniq("zone"), as = uniq("area"), cs = [...new Set(recs.map(r => r.category).filter(Boolean))].sort();

    <input type="search" id="q" class="inp col-span-2" placeholder="ค้นหา เลขที่ใบงาน / พื้นที่ / รายละเอียด" value="${esc(q)}">

}
const RB = "background:rgba(0,0,0,.65);color:#fff;border-radius:999px;width:1.6rem;height:1.6rem";
const zone = (dz, arr, title, color, cam) => `<div data-drop="${dz}" tabindex="0" class="zone rounded-2xl p-4 space-y-3" style="border:1.5px dashed color-mix(in srgb,${color} 50%,var(--line));background:color-mix(in srgb,${color} 4%,transparent)" aria-label="${title}">

      ${cam ? `<label class="btn2 text-xs cursor-pointer" style="min-height:2rem;padding:.2rem .6rem">📷<input type="file" accept="image/*" capture="environment" class="sr-only" data-addfile="${dz}" aria-label="ถ่ายรูป"></label>` : ""}</div></div>
  ${arr.length ? `<div class="grid grid-cols-4 sm:grid-cols-5 gap-2">${arr.map((u, i) => `<div class="relative"><button class="photo w-full" data-act="ph" data-dz="${dz}" data-i="${i}" aria-label="ดูรูปที่ ${i + 1}"><img src="${esc(u)}" alt="${title} ${i + 1}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'โหลดรูปไม่ได้',className:'text-xs p-1 block'}))"></button><button class="absolute top-1 right-1 text-xs" style="${RB}" data-act="delph" data-dz="${dz}" data-i="${i}" aria-label="ลบรูป">✕</button></div>`).join("")}</div>`
   : `<p class="text-xs" style="color:var(--muted)">ลากรูปมาวาง หรือคลิกกรอบแล้วกด Ctrl+V</p>`}
  <details class="text-xs"><summary class="cursor-pointer" style="color:var(--muted)">เพิ่มจากลิงก์รูป</summary><div class="flex gap-1 mt-2"><input class="inp" data-url="1" placeholder="https://…"><button class="btn2" data-act="addurl" data-dz="${dz}">เพิ่ม</button></div></details></div>`;
function closedRow(x) {   // การ์ดที่ปิดประเด็นแล้ว: ย่อเป็นแถวสรุป คลิกเพื่อขยาย
  const subs = x.subs, sum = subs.length ? `ข้อย่อย ${subs.filter(s => s.status === CLOSED).length}/${subs.length} · ${subs.map(s => s.text).join(" / ")}` : (x.detail || "-"), ca = closedAtOf(x);

    <span class="text-sm trunc" style="color:var(--muted);flex:1;min-width:8rem">${esc(sum)}</span>${ca ? `<span class="text-xs" style="color:var(--done)">${fmtT(ca)}</span>` : ""}<span aria-hidden="true" style="color:var(--muted)">▸</span></button></article>`; }

function card(x) {

  if (done && !openCards.has(x.id)) return closedRow(x);
  const sub = (s, i) => { const cl = s.status === CLOSED, ed = editSubs.has(s.id), dr = drafts.get(s.id) || {text:s.text, note:s.note || ""}, ro = ed ? "" : "readonly";
    return `<div class="p-4 rounded-2xl space-y-3" style="border:1px solid var(--line);border-left:4px solid ${SC[s.status]};${ed ? "background:color-mix(in srgb,var(--prog) 8%,var(--card))" : cl ? "background:color-mix(in srgb,var(--done) 10%,var(--card))" : ""}">
      <div class="flex gap-2 items-start"><span class="text-sm pt-2 w-5 shrink-0" style="${cl ? "color:var(--done);font-weight:700" : ""}">${cl ? "✓" : (i + 1) + "."}</span>
        <textarea rows="2" class="inp" style="${cl && !ed ? "text-decoration:line-through;color:var(--muted)" : ""}" data-f="subtext" data-sid="${s.id}" ${ro} aria-label="ข้อ ${i + 1}">${esc(dr.text)}</textarea></div>
      <textarea rows="2" class="inp" data-f="subnote" data-sid="${s.id}" ${ro} placeholder="รายละเอียดการดำเนินการข้อ ${i + 1}">${esc(dr.note)}</textarea>
      <div class="flex flex-wrap items-center gap-2">

        ${cl ? `<span class="pill" style="background:var(--done)">✓ ปิดประเด็นแล้ว</span>` : ""}${s.closedAt ? `<span class="text-xs" style="color:var(--done)">ปิดเมื่อ ${fmtT(s.closedAt)}</span>` : ""}

      ${zone(`${x.id}|${s.id}|after`, s.after || [], "รูปหลังแก้ไข (After)", "var(--done)", true)}</div>`; };

    ${zone(`${x.id}||photos`, x.photos, "รูปภาพหลักฐาน (Before)", "var(--wait)", false)}
    ${x.orig ? `<p class="text-xs" style="color:var(--muted)">รูปประกอบจากต้นฉบับ: ${/^https?:\/\/\S+$/.test(x.orig) ? `<a class="underline" style="color:var(--brand)" href="${esc(x.orig)}" target="_blank" rel="noopener">${esc(x.orig)}</a>` : esc(x.orig)}</p>` : ""}

/* ----- แท็บสถิติ ----- */
const weekStart = iso => { const d = new Date(iso + "T00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.toLocaleDateString("sv"); };
function vStat() {
  if (!recs.length) return `<p class="card p-4" style="color:var(--muted)">ยังไม่มีข้อมูล — นำเข้าไฟล์ตรวจเวรเพื่อดูสถิติ</p>`;
  const abn = recs.filter(r => r.result === "ab"), openN = abn.filter(r => effStatus(r) !== CLOSED).length, days = new Set(recs.map(r => r.date)).size;
  const k = (n, l, c) => `<div class="card p-2"><div class="text-2xl font-bold" style="color:${c}">${n}</div><div class="text-xs">${l}</div></div>`;
  const keyOf = d => per === "day" ? d : per === "week" ? weekStart(d) : d.slice(0, 7);
  const label = key => per === "day" ? fmtD(key) : per === "week" ? `${fmtD(key)} – ${fmtD(new Date(new Date(key + "T00:00").getTime() + 6 * 864e5).toLocaleDateString("sv"))}` : new Date(key + "-01T00:00").toLocaleDateString("th-TH", {month:"long", year:"numeric"});
  const G = {}; recs.forEach(r => { const g = G[keyOf(r.date)] ||= {n:0, a:0, d:new Set()}; g.n++; g.d.add(r.date); if (r.result === "ab") g.a++; });
  const rows = Object.keys(G).sort().reverse().map(key => { const g = G[key], p = pct(g.a, g.n);
    return `<div class="py-2" style="border-bottom:1px solid var(--line)"><div class="flex flex-wrap justify-between gap-1 text-sm"><b>${label(key)}</b>
      <span>ตรวจ ${g.n} จุด${per !== "day" ? ` (${g.d.size} วัน)` : ""} · พบ ${g.a} · <b style="color:${g.a ? "var(--bad)" : "var(--done)"}">${p}%</b></span></div><div class="bar mt-1"><i style="width:${p}%"></i></div></div>`; }).join("");
  const P = {}; recs.forEach(r => { const p = P[ptKey(r)] ||= {k:ptKey(r), n:0, a:0, cats:{}, items:[]}; p.n++; if (r.result === "ab") { p.a++; p.cats[r.category || FALLBACK] = (p.cats[r.category || FALLBACK] || 0) + 1; p.items.push(r); } });

  return `<div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-3">${k(days, "วันที่ตรวจ", "var(--brand)")}${k(recs.length, "จุดที่ตรวจทั้งหมด", "var(--brand)")}${k(abn.length, "พบปัญหา", "var(--bad)")}${k(pct(abn.length, recs.length) + "%", "อัตราพบปัญหา", "var(--bad)")}${k(openN, "ยังไม่ปิดประเด็น", "var(--wait)")}</div>
  <section class="card p-3 mb-3"><div class="flex flex-wrap items-center justify-between gap-2 mb-1"><h2 class="font-semibold">ภาพรวมย้อนหลัง</h2>
    <div class="seg flex" style="min-width:15rem" role="group">${[["day","รายวัน"],["week","รายสัปดาห์"],["month","รายเดือน"]].map(([v, t]) => `<button data-act="per" data-p="${v}" aria-pressed="${per === v}" style="${per === v ? "background:var(--brand)" : ""}">${t}</button>`).join("")}</div></div>${rows}</section>
  <section class="card p-3"><div class="flex flex-wrap items-center justify-between gap-2 mb-2"><h2 class="font-semibold">สถิติรายจุดตรวจ</h2>
    <input type="search" id="ptq" class="inp" style="max-width:16rem" placeholder="ค้นหาจุด/พื้นที่" value="${esc(ptq)}"></div>
    ${pts.map(p => { const o = openPts.has(p.k), pc = pct(p.a, p.n);
      return `<div style="border-bottom:1px solid var(--line)"><button class="w-full text-left py-2" data-act="pt" data-k="${esc(p.k)}" aria-expanded="${o}">

        <div class="bar mt-1"><i style="width:${pc}%"></i></div>${p.a ? `<div class="flex flex-wrap gap-1 mt-1">${Object.entries(p.cats).map(([c, n]) => `<span class="text-xs px-2 rounded-full" style="border:1px solid var(--line)">${esc(c)} ×${n}</span>`).join("")}</div>` : ""}</button>
        ${o ? `<div class="pb-2 pl-3 space-y-1 text-sm">${p.items.sort((a, b) => b.date.localeCompare(a.date)).map(r => `<div class="flex flex-wrap justify-between gap-2"><span><b>${fmtD(r.date)}</b> · ${esc(r.subs.length ? r.subs.map((s, i) => `${i + 1}) ${s.text}`).join(" ") : r.detail || "-")}</span>${statusPill(effStatus(r))}</div>`).join("") || `<span style="color:var(--muted)">ไม่เคยพบปัญหา</span>`}</div>` : ""}</div>`; }).join("") || `<p style="color:var(--muted)">ไม่พบจุดตรวจ</p>`}</section>`;

/* ----- แท็บหมวดหมู่ / ผู้รับผิดชอบ ----- */
function vManage() {
