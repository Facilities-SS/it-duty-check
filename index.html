/* ---- แมวทำความสะอาด ---- */
.stage{position:relative;height:172px;border-radius:22px;overflow:hidden;background:linear-gradient(#dbeafe 0%,#fce7f3 78%);border:1px solid var(--line);box-shadow:0 4px 14px rgba(124,58,237,.12)}

.stage .floor{position:absolute;left:0;right:0;bottom:0;height:36px;background:repeating-linear-gradient(90deg,#fde68a 0 40px,#fcd9a0 40px 80px);border-top:3px solid #f5c26b}
.stage .cloud{position:absolute;height:16px;width:56px;border-radius:999px;background:#fff;opacity:.85;animation:drift 46s linear infinite}
.stage .cloud::after{content:"";position:absolute;left:12px;top:-9px;width:26px;height:20px;border-radius:50%;background:#fff}

.stage .web{position:absolute;right:6px;top:0;width:86px;height:86px;z-index:1;animation:webfade 22s ease-in-out -10s infinite}

.cat{position:absolute;bottom:24px;width:84px;height:76px;z-index:2;left:var(--x0);animation:walk var(--d) ease-in-out var(--dl) infinite}
.cat .flip{position:relative;width:100%;height:100%;transform:scaleX(var(--f0));animation:flip var(--d) linear var(--dl) infinite}
@keyframes walk{0%{left:var(--x0)}28%,54%{left:var(--x1)}82%,100%{left:var(--x0)}}
@keyframes flip{0%,54%{transform:scaleX(var(--f0))}54.2%,99.8%{transform:scaleX(var(--f1))}100%{transform:scaleX(var(--f0))}}
.catsvg{width:100%;height:100%;overflow:visible;animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag 1s ease-in-out infinite alternate}

.leg{animation:stepl .35s ease-in-out infinite alternate}.leg.l2{animation-delay:.17s}

.btn2{background:var(--card);border:1px solid var(--line);color:var(--ink)}.btn2:hover:not(:disabled){background:color-mix(in srgb,var(--brand) 8%,var(--card));border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.btn-ok{background:var(--done)!important;color:#fff}
.btn-edit{border-color:color-mix(in srgb,var(--wait) 55%,var(--line));color:var(--wait)}.btn-edit:hover:not(:disabled){background:color-mix(in srgb,var(--wait) 12%,var(--card))!important}
.btn-del{border-color:color-mix(in srgb,var(--bad) 35%,var(--line));color:var(--bad)}.btn-del:hover:not(:disabled){background:color-mix(in srgb,var(--bad) 10%,var(--card))!important}
.tab{color:var(--muted)}.tab[aria-selected=true]{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.pill{box-shadow:none}
.zone{background:color-mix(in srgb,var(--field) 70%,transparent)!important}
.closed-row{padding:.7rem 1rem;border-left:4px solid var(--done);background:color-mix(in srgb,var(--done) 5%,var(--card))}
.closed-row button{min-height:2.4rem;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.inp,.btn,.btn2{min-height:2.75rem}.inp{font-size:16px}.card{border-radius:16px}}
/* ---- การ์ดปัญหา: ช่องข้อมูลโทนเดียวกับธีมหลัก ---- */
.tk{padding:0;overflow:hidden}
.tk-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;padding:.8rem 1.25rem;background:var(--hdr);color:var(--hdrfg);border-bottom:1px solid var(--line)}
.tk-body{padding:1.1rem 1.25rem 1.3rem;display:flex;flex-direction:column;gap:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.22rem .7rem;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid transparent;background:color-mix(in srgb,var(--tc) 11%,var(--card));color:color-mix(in srgb,var(--tc) 78%,var(--ink));border-color:color-mix(in srgb,var(--tc) 22%,transparent)}
.c-blue{--tc:#4f63d2}.c-lav{--tc:#8b6fd6}.c-pink{--tc:#d6609a}.c-gray{--tc:#64748b}
.sec{--tc:#4f63d2;display:flex;flex-direction:column;gap:.75rem;border-radius:20px;padding:1rem 1.1rem;border:1px solid color-mix(in srgb,var(--tc) 22%,var(--line));background:color-mix(in srgb,var(--tc) 6%,var(--card))}
.sec-blue{--tc:#4f63d2}.sec-lav{--tc:#8b6fd6}.sec-mint{--tc:#2f855a}.sec-pink{--tc:#d6609a}
.zone.sec{background:color-mix(in srgb,var(--tc) 6%,var(--card))!important;padding:1rem 1.1rem!important}
.sec.dz-over{background:color-mix(in srgb,var(--tc) 18%,var(--card))!important}
.sec-t{display:flex;align-items:center;gap:.55rem;font-size:.84rem;font-weight:700;color:color-mix(in srgb,var(--tc) 80%,var(--ink))}
.sec-t i{font-style:normal;display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:10px;background:color-mix(in srgb,var(--tc) 16%,var(--card));font-size:.95rem}
.sec-t small{font-weight:400;color:var(--muted);font-size:.74rem}
.sec .inp{background:var(--card);border-color:color-mix(in srgb,var(--tc) 18%,var(--line))}
.sec .inp:focus{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 18%,transparent)}
.sec .btn2{background:var(--card)}
.dz-hint{border:1.5px dashed color-mix(in srgb,var(--tc) 40%,var(--line));border-radius:14px;padding:.8rem;text-align:center;font-size:.78rem;color:var(--muted);background:color-mix(in srgb,var(--card) 70%,transparent)}
.fld{display:flex;flex-direction:column;gap:.35rem;font-size:.76rem;font-weight:600;color:var(--muted)}.fld .inp{font-weight:400;color:var(--ink)}
.sec .sec{background:color-mix(in srgb,var(--tc) 6%,var(--card))}
/* ---- รูปภาพ: ภาพย่อพอดี ลบได้ คลิกดูรูปใหญ่ ---- */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:.6rem}
.thumb{position:relative;width:96px;height:96px}
.thumb .photo{display:block;width:100%;height:100%;aspect-ratio:auto;border-radius:14px;cursor:zoom-in;box-shadow:0 1px 3px rgba(30,41,59,.12);border:2px solid var(--card)}
.thumb .photo img{transition:transform .2s}.thumb:hover .photo img{transform:scale(1.06)}
.thumb-x{position:absolute;top:-6px;right:-6px;width:1.6rem;height:1.6rem;border-radius:999px;background:var(--ink);color:var(--card);font-size:.7rem;line-height:1;border:2px solid var(--card);display:grid;place-items:center;opacity:.92}
.thumb-x:hover{background:var(--bad);transform:scale(1.1)}
#camV{transform:none}
/* ---- Dashboard ---- */
.kpi{display:flex;align-items:center;gap:.85rem;padding:1rem 1.1rem;border-radius:20px;border:1px solid color-mix(in srgb,var(--tc) 24%,var(--line));background:color-mix(in srgb,var(--tc) 7%,var(--card))}
.kpi>i{font-style:normal;display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:14px;font-size:1.4rem;background:color-mix(in srgb,var(--tc) 16%,var(--card))}
.kpi b{display:block;font-size:1.7rem;line-height:1.1;color:color-mix(in srgb,var(--tc) 85%,var(--ink))}
.hb{display:grid;grid-template-columns:minmax(5rem,9.5rem) 1fr 2rem;gap:.6rem;align-items:center;font-size:.82rem;margin:.4rem 0}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb-n{text-align:right}
.hb-t{display:flex;height:.95rem;border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--line) 70%,transparent)}.hb-t i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.74rem;color:var(--muted);margin:.25rem 0 .4rem}.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
.cols{display:flex;align-items:flex-end;gap:.4rem;height:170px;overflow-x:auto;padding:.4rem 0 .1rem}
.col-b{flex:1 0 2rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col-b .stk{width:70%;min-width:16px;min-height:3px;display:flex;flex-direction:column;border-radius:8px 8px 0 0;overflow:hidden}.col-b .stk i{display:block}
.col-l{font-size:.7rem;color:var(--muted);margin-top:.25rem;white-space:nowrap;max-width:5.5rem;overflow:hidden;text-overflow:ellipsis}
.dtab{width:100%;border-collapse:separate;border-spacing:0;font-size:.82rem;min-width:44rem}
.dtab th{position:sticky;top:0;background:color-mix(in srgb,var(--brand) 8%,var(--card));text-align:left;padding:.5rem .6rem;font-weight:700;border-bottom:1px solid var(--line)}
.dtab td{padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}.dtab tr:hover td{background:color-mix(in srgb,var(--brand) 5%,var(--card))}
/* ---- Export / ตารางกรอง / ปุ่มลอย ---- */
.cap-only{display:none}
.capturing{background:#fff!important;padding:18px;color:#1e293b;--ink:#1e293b;--paper:#f5f7fb;--card:#fff;--line:#e3e8f0;--muted:#64748b;--brand:#4f63d2;--wait:#b7791f;--prog:#2b7bb9;--done:#2f855a;--bad:#c2415b}
.capturing .cap-only{display:block}.capturing .no-cap{display:none!important}.capturing .cols{overflow:visible}
.capturing .kpi{background:var(--kbg)!important;border-color:var(--kbd)!important}.capturing .kpi>i{background:var(--kic)!important}.capturing .kpi b{color:var(--ktx)!important}
.capturing .hb-t{background:#e8edf5!important}.capturing .card{box-shadow:none!important;background:#fff!important}
.dhead{padding:0 0 .8rem;margin-bottom:.9rem;border-bottom:3px solid #4f63d2}.dh1{font-size:1.4rem;font-weight:700;color:#27304f}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:15.5rem;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(30,41,59,.18);padding:.4rem}
.menu[hidden]{display:none}.menu button{text-align:left;padding:.6rem .8rem;border-radius:10px;font-size:.88rem;min-height:2.5rem}.menu button:hover{background:color-mix(in srgb,var(--brand) 10%,var(--card))}
.chipbtn{padding:.4rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.82rem;transition:background-color .15s,transform .12s}.chipbtn b{margin-left:.3rem;color:var(--muted)}
.chipbtn:hover{background:color-mix(in srgb,var(--brand) 8%,var(--card))}.chipbtn:active{transform:scale(.96)}.chipbtn[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}.chipbtn[aria-pressed=true] b{color:#fff}
.thb{font-weight:700;display:inline-flex;gap:.25rem;align-items:center}.thb:hover{color:var(--brand)}
.fab-wrap{position:fixed;right:max(.9rem,env(safe-area-inset-right));bottom:max(.9rem,env(safe-area-inset-bottom));z-index:45;display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
.fab{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.6rem 1rem;font-size:.85rem;font-weight:600;box-shadow:0 6px 18px rgba(30,41,59,.2);min-height:2.75rem;transition:transform .12s,background-color .15s}
.fab:hover{background:color-mix(in srgb,var(--brand) 10%,var(--card))}.fab:active{transform:scale(.95)}.fab[hidden]{display:none}
.fab-wrap .menu{top:auto;bottom:calc(100% + 8px);max-height:50vh;overflow:auto;position:absolute}
#topBtn{background:var(--brand);color:#fff;border-color:var(--brand)}
@media print{.fab-wrap{display:none}}
</style>
</head>
<body>
<header class="px-4 py-3" style="background:var(--hdr);color:var(--hdrfg)">
  <div class="max-w-6xl mx-auto"><h1 class="text-lg font-bold">🐾 ติดตามผลตรวจเวรวันหยุด</h1>
  <p class="text-xs opacity-90">บริษัท ไอ-เทล คอร์ปอเรชั่น จำกัด (มหาชน) · ซิงค์ผ่าน Firebase Cloud <span id="syncBadge" class="ml-1 px-2 rounded-full" style="background:rgba(255,255,255,.6)">⏳ กำลังเชื่อมต่อ…</span></p></div>
</header>
<nav class="border-b" style="border-color:var(--line)"><div class="max-w-6xl mx-auto flex overflow-x-auto" role="tablist">
  <button class="tab" data-v="day" role="tab">ผลตรวจ</button><button class="tab" data-v="stat" role="tab">สถิติ</button><button class="tab" data-v="manage" role="tab">หมวดหมู่ / ผู้รับผิดชอบ</button>
</div></nav>
<main class="max-w-6xl mx-auto p-3 sm:p-4 space-y-3">
  <section id="stage" class="stage" aria-label="ฉากตกแต่ง"></section>
  <label id="drop" class="card p-3 border-2 border-dashed block text-center cursor-pointer">
    <input type="file" id="xl" accept=".xlsx,.xls" class="sr-only">
    <b>แตะเพื่อเลือกไฟล์ตรวจเวร (Excel)</b> หรือลากมาวาง
    <span class="block text-xs" style="color:var(--muted)">นำเข้าทุกแถว (พบ/ไม่พบสิ่งผิดปกติ) เพื่อทำสถิติ · นำเข้าไฟล์ซ้ำได้ ระบบข้ามรายการเดิมและคงสถานะที่แก้ไว้</span>
  </label>
  <details id="mapBox" class="card p-3 text-sm" hidden></details>
  <div class="flex flex-wrap gap-2">
    <button class="btn" id="exp">ส่งออกรายงานสรุป (PDF / Excel)</button><button class="btn2" id="tpl">ไฟล์ตัวอย่าง</button>
    <button class="btn2" id="clr" style="color:var(--bad)">ล้างข้อมูลตรวจเวร</button>
  </div>
  <div id="view"></div>
</main>

<dialog id="lb" class="lb">
  <div class="w-full h-full flex flex-col items-center justify-center p-2 text-white">
    <div class="flex justify-between items-center w-full max-w-3xl mb-2"><span id="lbN"></span><button class="btn2" style="color:#000" id="lbX">ปิด ✕</button></div>
    <div class="flex items-center gap-2 w-full max-w-3xl justify-center">
      <button class="btn2" style="color:#000" id="lbP" aria-label="รูปก่อนหน้า">‹</button>
      <img id="lbI" alt="รูปหลักฐาน" class="max-h-[78dvh] max-w-[76vw] object-contain rounded">
      <button class="btn2" style="color:#000" id="lbNx" aria-label="รูปถัดไป">›</button></div>
  </div>
</dialog>
<dialog id="expD" class="card p-4 w-[min(28rem,94vw)]" style="color:var(--ink)"><h2 class="font-semibold mb-2">ส่งออกรายงานสรุป</h2><div class="space-y-2 text-sm">
  <div class="grid grid-cols-2 gap-2"><label>รูปแบบ<select id="eFmt" class="inp"><option value="pdf">PDF (พร้อมรูปภาพ)</option><option value="xlsx">Excel</option></select></label>
  <label>แนวกระดาษ (PDF)<select id="eOri" class="inp"><option value="p">แนวตั้ง</option><option value="l">แนวนอน</option></select></label>
  <label>ตั้งแต่วันที่<input type="date" id="eFrom" class="inp"></label><label>ถึงวันที่<input type="date" id="eTo" class="inp"></label></div>
  <label>ขอบเขตรายการ<select id="eScope" class="inp"><option value="all">ทุกรายการที่พบปัญหา</option><option value="open">เฉพาะงานค้าง (ยังไม่ปิดประเด็น)</option></select></label>
  <label class="flex gap-2 items-center"><input type="checkbox" id="ePh" checked> แนบรูปภาพ (Before / After) ในรายงาน PDF</label>
  <label class="flex gap-2 items-center"><input type="checkbox" id="eCols" checked> จัดรายการเป็น 2 คอลัมน์ (กระชับ ประหยัดหน้า)</label></div>
  <div class="flex justify-end gap-2 mt-3"><button class="btn2" id="eCancel">ปิด</button><button class="btn" id="eGo">ส่งออก</button></div></dialog>
<div class="fab-wrap" id="fab"><div id="jumpMenu" class="menu" role="menu" hidden></div><button class="fab" id="jumpBtn" hidden>📅 ไปยังวันที่</button><button class="fab" id="topBtn" hidden aria-label="กลับด้านบน">▲ กลับด้านบน</button></div>
<dialog id="camD" class="card p-4 w-[min(34rem,94vw)]" style="color:var(--ink)"><h2 class="font-semibold mb-2">📷 ถ่ายรูป</h2>
  <video id="camV" autoplay playsinline muted style="width:100%;border-radius:14px;background:#0f172a;max-height:60vh"></video><p id="camMsg" class="text-xs mt-2" style="color:var(--muted)"></p>
  <div class="flex flex-wrap justify-between gap-2 mt-3"><button class="btn2" id="camSw">🔄 สลับกล้อง</button><div class="flex gap-2"><button class="btn2" id="camX">ปิด</button><button class="btn" id="camSnap">📸 ถ่ายรูป</button></div></div></dialog>
<dialog id="askD" class="card p-4 w-[min(24rem,92vw)]" style="color:var(--ink)"><p id="askT" class="mb-3"></p><div class="flex justify-end gap-2"><button class="btn2" id="askN">ยกเลิก</button><button class="btn" id="askY">ตกลง</button></div></dialog>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-md text-sm hidden z-50 max-w-[92vw]" style="background:var(--ink);color:var(--paper)"></div>

<script>
const KEY = {rec:"itl3_records", cat:"itl3_categories", wk:"itl3_workers"};
const WAIT = "รอติดตาม", PROG = "กำลังดำเนินการ", CLOSED = "ปิดประเด็นแล้ว", STATUS = [WAIT, PROG, CLOSED];
const SC = {[WAIT]:"var(--wait)", [PROG]:"var(--prog)", [CLOSED]:"var(--done)"};
const FALLBACK = "อื่นๆ";
/* หมวดหมู่เริ่มต้น + คำสำคัญ (คั่นด้วย ,) — แก้ไขได้ในแท็บ "หมวดหมู่ / ผู้รับผิดชอบ" */
const DEF_CATS = [
  {name:"รั่วไหล", kw:"รั่ว,ซึม,หยด,leak,น้ำท่วม,น้ำขัง,คราบน้ำมัน,สารเคมีหก"},
  {name:"PPE", kw:"ppe,หมวก,แว่น,ถุงมือ,รองเท้า,ที่อุดหู,หน้ากาก,ชุดป้องกัน,ไม่สวม"},
  {name:"พลังงาน", kw:"ไฟ,หลอด,แอร์,เครื่องปรับอากาศ,พลังงาน,ลมรั่ว,คอมเพรสเซอร์,ปั๊ม,มอเตอร์,ไม่ปิด,ปลั๊ก"},
  {name:"5S", kw:"5s,5ส,สะอาด,เศษ,รก,จัดเก็บ,วางของ,ขยะ,ฝุ่น,ทางเดิน,ป้ายชื่อ"},
  {name:"ความปลอดภัย", kw:"ดับเพลิง,ทางหนีไฟ,ฉุกเฉิน,การ์ด,guard,ป้ายเตือน,ที่ล้างตา,สัญญาณเตือน,กั้น"},
  {name:"เครื่องจักร/อุปกรณ์", kw:"เครื่องจักร,สายพาน,ลูกปืน,เสียงดัง,สั่น,ชำรุด,แตก,หลุด,พัง,เสีย"},
  {name:FALLBACK, kw:""}
];
/* ชื่อคอลัมน์ที่เป็นไปได้ของแต่ละฟิลด์: ex = ชื่อที่ตรงหรือมีคำนี้อยู่ (คะแนนสูง), kw = คำกว้างๆ (คะแนนต่ำ ใช้เมื่อไม่เจอชื่อตรง) */
const FIELDS = {
  order:{ex:["ลำดับ","ลำดับที่","เลขที่","item"], kw:["ลำดับ"]},
  date:{ex:["วันที่ตรวจ","วันที่","date","วัน-เวลา"], kw:["วัน","date"]},
  zone:{ex:["zone","โซน"], kw:["โซน","zone"]},
  area:{ex:["พื้นที่ตรวจ","พื้นที่","จุดตรวจ","area","สถานที่","location"], kw:["พื้นที่","สถานที่","area","location"]},
  result:{ex:["ผลตรวจ","ผลการตรวจ","พบ/ไม่พบ","สถานะ","status","result","ผล"], kw:["ผล","result","สถานะ"]},
  type:{ex:["ประเภทปัญหา","ประเภท","category","หมวดหมู่","type"], kw:["ประเภท","category","หมวด","type"]},
  detail:{ex:["รายละเอียดที่พบ","รายละเอียด","ปัญหาที่พบ","detail","ปัญหา","สิ่งที่พบ","remark"], kw:["รายละเอียด","detail","ปัญหา","remark"]},
  onsite:{ex:["การแก้ไขณจุดตรวจ","แก้ไขณจุดตรวจ","การแก้ไขทันที","แก้ไขทันที"], kw:["ณจุดตรวจ","แก้ไขทันที"]},
  measure:{ex:["มาตรการแก้ไขและติดตาม","มาตรการแก้ไข","มาตรการ"], kw:["มาตรการ","ติดตามผล"]},
  worker:{ex:["ผู้รับผิดชอบ","ผู้ปฏิบัติงาน","ผู้แก้ไข","ช่าง","worker"], kw:["รับผิดชอบ","ปฏิบัติ","ช่าง","worker"]},
  due:{ex:["กำหนดเสร็จ","กำหนดแล้วเสร็จ","duedate","due"], kw:["กำหนด","due"]},
  fstatus:{ex:["สถานะติดตาม","สถานะการติดตาม"], kw:["สถานะติดตาม"]},
  inspector:{ex:["ผู้ตรวจสอบ","ผู้ตรวจ","inspector","ตรวจโดย"], kw:["ตรวจ","inspect"]},
  pdf:{ex:["หน้าpdf","pdfpage","หน้า"], kw:["pdf"]},

/* ===== เหตุการณ์ ===== */
const V = $("#view");

    if (!await ask(`ลบข้อมูลวันที่ ${fmtD(d)} ทั้งหมด ${list.length} รายการ (พบปัญหา ${nab} รายการ)?${fdb ? " ข้อมูลบน Firebase จะถูกลบและหายจากทุกเครื่อง" : ""} วันที่อื่นไม่ถูกกระทบ`)) return;
    recs = recs.filter(x => x.date !== d); openDays.delete(d); toast(`ลบข้อมูลวันที่ ${fmtD(d)} แล้ว (${list.length} รายการ)`); }

  else if (a === "datecancel") editDate = null;
  else if (a === "datesave") { const d = b.dataset.d, nv = $("#dateIn").value; if (!nv) return toast("กรุณาเลือกวันที่");
    if (nv !== d) { recs.forEach(x => { if (x.date === d) x.date = nv; }); if (openDays.delete(d)) openDays.add(nv); toast(`เปลี่ยนวันที่เป็น ${fmtD(nv)} แล้ว (เลขที่ใบงานคงเดิม)`); } editDate = null; }
  else if (a === "pt") { const k = b.dataset.k; openPts.has(k) ? openPts.delete(k) : openPts.add(k); }
  else if (a === "per") { per = b.dataset.p; statKey = ""; }
  else if (a === "grp") grpBy = b.dataset.g;
  else if (a === "sortdir") { tSort === "date" ? sortAsc = !sortAsc : (tSort = "date", sortAsc = false); }
  else if (a === "tsort") { const k = b.dataset.k; tSort === k ? sortAsc = !sortAsc : (tSort = k, sortAsc = false); }

  else if (a === "expmenu") expMenu = !expMenu;

  else if (a === "gotoday") { document.querySelector(`[data-dayhdr="${b.dataset.d}"]`)?.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  else if (a === "statnav") { const ks = statKeys(), i = ks.indexOf(statKey && statKey !== "ALL" ? statKey : ks[0]), j = i - (+b.dataset.dir); if (j >= 0 && j < ks.length) statKey = ks[j]; }
