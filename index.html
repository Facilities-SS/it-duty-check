const nh = x => norm(x).replace(/[:：.()\/\\\-_*,]/g, "");
function mapCols(row) {
  const pairs = [];
  row.forEach((c, i) => {
    const h = nh(c);
    if (!h || PHOTO_RE.test(String(c))) return;
    for (const [f, d] of Object.entries(FIELDS)) {
      const ex = d.ex.map(nh);
      let sc = 0;
      if (ex.includes(h)) sc = 100;
      else {
        const hit = ex.filter(a => h.includes(a)).sort((x, y) => y.length - x.length)[0];
        if (hit) sc = 50 + hit.length;
        else {
          const k = d.kw.map(nh).filter(a => h.includes(a)).sort((x, y) => y.length - x.length)[0];
          if (k) sc = 10 + k.length;
        }
      }
      if (sc) pairs.push([sc, f, i]);
    }
  });
  pairs.sort((a, b) => b[0] - a[0]);
  const col = Object.fromEntries(Object.keys(FIELDS).map(f => [f, -1])), used = new Set();
  let score = 0;
  for (const [sc, f, i] of pairs) {
    if (col[f] < 0 && !used.has(i)) { col[f] = i; used.add(i); score += sc; }
  }
  return {col, score};
}
function findHeaderRow(rows) {
  let best = null;
  for (let h = 0; h < Math.min(rows.length - 1, 35); h++) {
    const hs = rows[h].map(nh);
    const hasType = hs.includes(nh("ประเภท")) || hs.some(x => x.includes(nh("ประเภท")));
    const hasArea = hs.includes(nh("พื้นที่")) || hs.includes(nh("zone")) || hs.some(x => x.includes(nh("พื้นที่")) || x === nh("zone"));
    const m = mapCols(rows[h]);
    const n = Object.values(m.col).filter(i => i >= 0).length;
    const bonus = (hasType && hasArea) ? 5000 : 0;
    const w = n * 1000 + m.score + bonus;
    if (n >= 2 && (!best || w > best.w)) {
      best = {w, h, col:m.col, hasType, hasArea};
    }
  }
  return best;
}

function closedRow(x) {

const late = x => !!x.due && effStatus(x) !== CLOSED && x.due < new Date().toLocaleDateString("sv");

  const sub = (s, i) => {

        ${cl ? `<span class="pill" style="background:var(--done)">✓ ปิดประเด็นแล้ว</span>` : ""}${s.closedAt ? `<span class="text-xs" style="color:var(--done)">ปิดเมื่อ ${fmtT(s.closedAt)}</span>` : ""}

      ${zone(`${x.id}|${s.id}|after`, s.after || [], "รูปหลังแก้ไข (After)", "var(--done)", true)}</div>`;
  };
  const chip = (cls, ico, t) => t ? `<span class="chip ${cls}">${ico} ${esc(t)}</span>` : "";
  const zc = canonZone(x.zone, x.area, x.entryType), ac = x.area && x.area !== "-" ? x.area : "";
  const zoneOptions = ZONE_MASTER.map(z => z.id);
  return `<article class="card tk ${flashId === x.id ? "flash" : ""}" data-id="${x.id}" style="border-left:5px solid ${SC[st]};${done ? "opacity:.92" : ""}">
    <div class="tk-head"><b class="font-mono text-sm">${x.order ? "#" + x.order + " · " : ""}${done ? "✓ " : ""}${esc(x.ticket)}</b>
      <span class="flex flex-wrap items-center gap-2"><button class="btn2 text-xs" data-act="gotoday" data-d="${x.date}" title="เลื่อนกลับไปหัวข้อวันที่นี้" aria-label="กลับไปหัวข้อวันที่ ${esc(fmtD(x.date))}">⤴ ${fmtD(x.date)}</button>${done ? `<button class="btn2 text-xs" data-act="cardtoggle" data-id="${x.id}" aria-expanded="true">▴ ย่อการ์ด</button>` : ""}${late(x) ? `<span class="pill" style="background:var(--bad)">เกินกำหนด</span>` : ""}${statusPill(st)}</span></div>
    <div class="tk-body">
      <div><h3 class="font-semibold text-base mb-2">${esc(ac || zc || "ไม่ระบุพื้นที่")}</h3>
        <div class="chips">${chip("c-blue", "📍", zc)}${x.entryType && x.entryType !== "ตรวจพื้นที่" ? chip("c-pink", "🏷️", "ประเภท: " + x.entryType) : ""}${chip("c-pink", "⚠️", x.type && x.type !== "-" ? x.type : "")}${chip("c-lav", "👤", "ผู้ตรวจ " + (x.inspector || "-"))}${x.duty && x.duty !== x.inspector ? chip("c-lav", "🧹", "ผู้ปฏิบัติงาน " + x.duty) : ""}${x.worker ? chip("c-blue", "🛠️", "ผู้รับผิดชอบ " + x.worker) : ""}${x.pdf ? chip("c-gray", "📄", "หน้า PDF " + x.pdf) : ""}${x.stamp ? chip("c-gray", "🕒", "บันทึก " + x.stamp) : ""}</div></div>
      ${subs.length ? "" : `<section class="sec sec-blue"><div class="sec-t"><i>📝</i>รายละเอียดที่พบ <small>แก้ไขพิมพ์ทับได้ · บันทึกอัตโนมัติ</small></div><textarea class="inp" rows="3" data-f="detail" aria-label="รายละเอียดที่พบ">${esc(x.detail)}</textarea></section>`}
      ${zone(`${x.id}||photos`, x.photos, "รูปภาพหลักฐาน (Before)", "var(--wait)", false)}
      ${x.orig ? `<p class="text-xs" style="color:var(--muted)">รูปประกอบจากต้นฉบับ: ${/^https?:\/\/\S+$/.test(x.orig) ? `<a class="underline" style="color:var(--brand)" href="${esc(x.orig)}" target="_blank" rel="noopener">${esc(x.orig)}</a>` : esc(x.orig)}</p>` : ""}
      ${subs.length ? "" : zone(`${x.id}||after`, x.after || [], "รูปหลังแก้ไข (After)", "var(--done)", true)}
      ${!subs.length && x.afterNote ? `<p class="text-xs" style="color:var(--muted)">หมายเหตุรูปหลังแก้ไข: ${esc(x.afterNote)}</p>` : ""}
      <section class="sec sec-pink"><div class="sec-t"><i>🔧</i>การแก้ไข ณ จุดตรวจ <small>แก้ไขทันที · บันทึกอัตโนมัติ</small></div><textarea class="inp" rows="2" data-f="onsite" placeholder="สิ่งที่แก้ไขทันที ณ จุดตรวจ" aria-label="การแก้ไข ณ จุดตรวจ">${esc(x.onsite)}</textarea></section>
      <section class="sec sec-blue"><div class="sec-t"><i>🗂</i>การติดตามผล</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <label class="fld">Zone (แก้ไขได้)<select class="inp" data-f="zone" aria-label="แก้ไข Zone">${zoneOptions.map(z => `<option value="${esc(z)}" ${z === zc ? "selected" : ""}>${esc(z)}</option>`).join("")}</select></label>
          <label class="fld">หมวดหมู่<select class="inp" data-f="category">${opt(cats.map(c => c.name), x.category)}</select></label>
          <label class="fld">ผู้รับผิดชอบ<select class="inp" data-f="worker">${opt(workers, x.worker, "ไม่ระบุ")}</select></label>
          <label class="fld">กำหนดเสร็จ<input type="date" class="inp" data-f="due" value="${esc(x.due)}" style="${late(x) ? "border-color:var(--bad)" : ""}"></label></div>
        ${subs.length ? `<div class="space-y-3"><p class="text-xs font-semibold" style="color:var(--muted)">ข้อย่อย (${subs.filter(s => s.status === CLOSED).length}/${subs.length} ปิดแล้ว) — ล็อกไว้ ต้องกด “แก้ไข” แล้ว “บันทึก”</p>${subs.map(sub).join("")}</div>`
        : `<div class="seg flex" role="group" aria-label="สถานะติดตาม">${STATUS.map(s => `<button data-act="st" data-id="${x.id}" data-s="${s}" aria-pressed="${s === x.status}" style="${s === x.status ? "background:" + SC[s] + ";border-color:" + SC[s] : ""}">${s}</button>`).join("")}</div>`}
        ${ca ? `<p class="text-xs font-semibold" style="color:var(--done)">ปิดประเด็นเมื่อ ${fmtT(ca)}</p>` : ""}
        <div class="flex flex-wrap gap-2 text-sm">
          ${subs.length ? `<button class="btn2" data-act="unsplit" data-id="${x.id}">ยกเลิกการแยกข้อย่อย</button>` : `<button class="btn2" data-act="split" data-id="${x.id}" ${can ? "" : 'title="ไม่พบการเรียงเป็นข้อๆ ในรายละเอียด"'}>แยกเป็นข้อย่อย</button>`}
          <button class="btn2" data-act="addsub" data-id="${x.id}">+ เพิ่มข้อย่อย</button></div>
        <label class="fld">${subs.length ? "มาตรการแก้ไขและติดตาม (รวม)" : "มาตรการแก้ไขและติดตาม"}<textarea class="inp" rows="${st === PROG && !subs.length ? 3 : 2}" data-f="note" placeholder="ระบุสิ่งที่ทำ / ผู้ติดตาม / กำหนดเสร็จ" style="${st === PROG ? "border-color:var(--prog)" : ""}">${esc(x.note)}</textarea></label></section>
      <div><button class="btn2 btn-del text-xs" data-act="del" data-id="${x.id}">ลบรายการนี้</button></div>
    </div></article>`;
}

/* ----- แท็บสถิติ / Dashboard (13 Zone · 49 จุดตรวจ + หมวดนอก Zone หลัก) ----- */
const weekStart = iso => { const d = new Date(iso + "T00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.toLocaleDateString("sv"); };
const wkEnd = k => new Date(new Date(k + "T00:00").getTime() + 6 * 864e5).toLocaleDateString("sv");
const perKeyOf = (d, p) => p === "day" ? d : p === "week" ? weekStart(d) : p === "month" ? d.slice(0, 7) : d.slice(0, 4);
const perLabel = (k, p) => p === "day" ? fmtD(k) : p === "week" ? `${fmtD(k)} – ${fmtD(wkEnd(k))}` : p === "month" ? new Date(k + "-01T00:00").toLocaleDateString("th-TH", {month:"long", year:"numeric"}) : "ปี " + new Date(k + "-01-01T00:00").toLocaleDateString("th-TH", {year:"numeric"});
const statKeys = () => [...new Set(recs.filter(r => r.date).map(r => perKeyOf(r.date, per)))].sort().reverse();
const typeOf = r => r.type && r.type !== "-" ? r.type : (r.category || "ไม่ระบุ");

function vStat() {
  if (!recs.length) return `<p class="card p-4" style="color:var(--muted)">ยังไม่มีข้อมูล — นำเข้าไฟล์ตรวจเวรเพื่อดูสถิติ</p>`;
  const keys = statKeys();
  if (statKey && statKey !== "ALL" && !keys.includes(statKey)) statKey = "";
  const key = statKey === "ALL" ? "ALL" : (statKey || keys[0]);
  const inP = r => key === "ALL" || perKeyOf(r.date, per) === key;
  const all = recs.filter(inP);
  const st = r => effStatus(r);

  /* แยกข้อมูล 13 โซนหลัก (49 จุดตรวจ) กับรายการนอกหมวด Zone หลัก */
  const mainAll = all.filter(r => isMasterZone(canonZone(r.zone, r.area, r.entryType)));
  const extraAll = all.filter(r => !isMasterZone(canonZone(r.zone, r.area, r.entryType)));

  const zonesCheckedSet = new Set(mainAll.map(r => canonZone(r.zone, r.area, r.entryType)));
  const zonesCheckedCount = zonesCheckedSet.size;
  const ptsCheckedCount = mainAll.length;
  const okMainCount = mainAll.filter(r => r.result === "ok").length;
  const abMainCount = mainAll.filter(r => r.result === "ab").length;

  const abn = all.filter(r => r.result === "ab");
  const okAllCount = all.length - abn.length;
  const closed = abn.filter(r => st(r) === CLOSED).length;
  const prog = abn.filter(r => st(r) === PROG).length;
  const openCount = abn.length - closed;
  const wait = openCount - prog;
  const rate = pct(closed, abn.length);

  const mixW = (hex, p) => "#" + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * p + 255 * (1 - p)).toString(16).padStart(2, "0")).join("");
  const shade = (hex, p) => "#" + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * p).toString(16).padStart(2, "0")).join("");
  const tone = tc => `--tc:${tc};--kbg:${mixW(tc, .08)};--kbd:${mixW(tc, .28)};--kic:${mixW(tc, .18)};--ktx:${shade(tc, .8)}`;
  const kpi = (tc, ico, n, label, sub) => `<div class="kpi" style="${tone(tc)}"><i>${ico}</i><div><b>${n}</b><div class="text-sm font-semibold">${label}</div>${sub ? `<div class="text-xs" style="color:var(--muted)">${sub}</div>` : ""}</div></div>`;
  const C = 2 * Math.PI * 26;
  const ring = `<div class="kpi" style="${tone("#8b6fd6")}"><div style="position:relative;width:64px;height:64px;flex:none"><svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="อัตราความสำเร็จ ${rate}%"><circle cx="32" cy="32" r="26" fill="none" stroke="#dfe4ee" stroke-width="8"/><circle cx="32" cy="32" r="26" fill="none" stroke="#2f855a" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(C * rate / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/></svg><span style="position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:.85rem">${Math.round(rate)}%</span></div><div><b>${rate}%</b><div class="text-sm font-semibold">อัตราความสำเร็จการปิดประเด็น</div><div class="text-xs" style="color:var(--muted)">ปิดแล้ว ${closed} จาก ${abn.length} รายการปัญหา · ค้าง ${openCount}</div></div></div>`;

  const grp = (rows, f, sortFn) => {
    const m = {};
    rows.forEach(r => {
      const k = f(r) || "ไม่ระบุ", g = m[k] ||= {k, n:0, c:0, p:0, w:0}, s2 = st(r);
      g.n++;
      s2 === CLOSED ? g.c++ : s2 === PROG ? g.p++ : g.w++;
    });
    return Object.values(m).sort(sortFn || ((a, b) => b.n - a.n || natSortStr(a.k, b.k)));
  };
  const statusCountText = g => {
    const parts = [];
    if (g.c > 0) parts.push(`ปิด ${g.c}`);
    if (g.p > 0) parts.push(`กำลังดำเนินการ ${g.p}`);
    if (g.w > 0) parts.push(`รอติดตาม ${g.w}`);
    return parts.length ? ` (${parts.join(" · ")})` : "";
  };
  const hbar = (rows, lim = 15) => {
    if (!rows.length) return `<p class="text-sm" style="color:var(--muted)">ไม่มีข้อมูลในช่วงนี้</p>`;
    const mx = Math.max(1, ...rows.map(g => g.n));
    return rows.slice(0, lim).map(g => `<div class="hb"><div class="hb-l" title="${esc(g.k)} · พบปัญหา ${g.n}${statusCountText(g)}">${esc(g.k)}</div><div class="hb-t" title="${esc(g.k)} · พบปัญหา ${g.n}${statusCountText(g)}"><i style="width:${g.c / mx * 100}%;background:var(--done)"></i><i style="width:${g.p / mx * 100}%;background:var(--prog)"></i><i style="width:${g.w / mx * 100}%;background:var(--wait)"></i></div><div class="hb-n" style="white-space:nowrap"><b>${g.n}</b><span class="text-xs" style="color:var(--muted);margin-left:.3rem">${statusCountText(g)}</span></div></div>`).join("") + (rows.length > lim ? `<p class="text-xs" style="color:var(--muted)">และอีก ${rows.length - lim} กลุ่ม</p>` : "");
  };

  const byType = grp(abn, typeOf);
  const legendFull = `<div class="legend"><span><i style="background:var(--done)"></i>พบปัญหา · ปิดประเด็นแล้ว</span><span><i style="background:var(--prog)"></i>พบปัญหา · กำลังดำเนินการ</span><span><i style="background:var(--wait)"></i>พบปัญหา · รอติดตาม</span><span><i style="background:var(--okbar)"></i>ไม่พบปัญหา / ปกติ</span></div>`;
  const legend = `<div class="legend"><span><i style="background:var(--done)"></i>ปิดประเด็นแล้ว</span><span><i style="background:var(--prog)"></i>กำลังดำเนินการ</span><span><i style="background:var(--wait)"></i>รอติดตาม</span></div>`;
  const byWorker = grp(abn, r => r.worker);

  /* ส่วนแสดง "แยกตามประเภทปัญหา" ในแผนภูมิเดียวกัน พร้อมปุ่มสลับเป็น List แยกตามประเภทปัญหาและสถานะ */
  const typeListHtml = byType.length
    ? `<div class="grid sm:grid-cols-2 gap-2.5 mt-2">
        ${byType.map(g => `<div class="type-list-card">
          <div class="flex items-center justify-between gap-2 text-xs font-bold">
            <span>⚠️ ${esc(g.k)}</span>
            <span>พบปัญหา ${g.n} รายการ</span>
          </div>
          <div class="type-badges">
            <span class="tbadge" style="color:var(--done)">✓ ปิดประเด็นแล้ว: <b>${g.c}</b></span>
            <span class="tbadge" style="color:var(--prog)">🔄 กำลังดำเนินการ: <b>${g.p}</b></span>
            <span class="tbadge" style="color:var(--wait)">⏳ รอติดตาม: <b>${g.w}</b></span>
          </div>
        </div>`).join("")}
      </div>`
    : `<p class="text-sm mt-2" style="color:var(--muted)">ไม่มีรายการปัญหาในช่วงนี้</p>`;

  const typePanelHtml = `<div class="mt-4 pt-3" style="border-top:1px dashed var(--line)">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
      <h3 class="text-sm font-bold">แยกตามประเภทปัญหา (${abn.length} รายการ)</h3>
      <div class="inline-flex rounded-xl overflow-hidden border no-cap" style="border-color:var(--line)" role="group" aria-label="โหมดแสดงประเภทปัญหา">
        <button type="button" class="px-2.5 py-1 text-xs font-semibold" data-act="typemode" data-m="chart" style="${typeMode === "chart" ? "background:var(--brand);color:#fff" : "background:var(--card);color:var(--ink)"}">📊 แผนภูมิ</button>
        <button type="button" class="px-2.5 py-1 text-xs font-semibold" data-act="typemode" data-m="list" style="${typeMode === "list" ? "background:var(--brand);color:#fff" : "background:var(--card);color:var(--ink)"}">📋 รายการ (List)</button>
      </div>
    </div>
    ${typeMode === "list" ? typeListHtml : `${legend}${hbar(byType)}`}
  </div>`;

  /* สรุปรายการ "กำลังดำเนินการ" แยกตามผู้รับผิดชอบ */
  const progRows = abn.filter(r => st(r) === PROG);
  const progByW = {};
  progRows.forEach(r => {
    const w = r.worker || "ยังไม่ระบุผู้รับผิดชอบ";
    (progByW[w] ||= []).push(r);
  });
  const progSummaryHtml = progRows.length
    ? `<div class="prog-box"><div class="flex items-center justify-between gap-2"><span class="text-xs font-bold" style="color:var(--prog)">🔄 กำลังดำเนินการอยู่ที่ใคร (${progRows.length} รายการ)</span><span class="text-xs" style="color:var(--muted)">คลิกเพื่อเปิดแก้ไข</span></div>
        ${Object.entries(progByW).sort((a, b) => b[1].length - a[1].length).map(([w, list]) => `
          <div class="prog-item">
            <div class="flex items-center justify-between gap-2 text-xs font-semibold">
              <span>👤 ${esc(w)}</span>
              <span class="px-2 py-0.5 rounded-full" style="background:color-mix(in srgb,var(--prog) 15%,transparent);color:var(--prog)">${list.length} รายการ</span>
            </div>
            <div class="mt-1 space-y-1">
              ${list.map(r => `<button class="w-full text-left text-xs flex items-center justify-between gap-2 py-0.5 hover:underline" style="color:var(--ink)" data-act="gotoissue" data-id="${r.id}" data-d="${r.date}">
                <span class="trunc">• <b>${esc(canonZone(r.zone, r.area, r.entryType))}</b> (${esc(r.area || "-")}) — ${esc(r.detail || "-")}</span>
                <span class="shrink-0 font-mono" style="color:var(--brand)">${esc(r.ticket)} ↗</span>
              </button>`).join("")}
            </div>
          </div>`).join("")}
      </div>`
    : `<div class="prog-box"><span class="text-xs font-semibold" style="color:var(--done)">✓ ไม่มีรายการค้างในสถานะกำลังดำเนินการ</span></div>`;

  /* กราฟแท่ง 13 Zone + นอก Zone: ความสูงแท่งแสดง "จำนวนที่ตรวจสอบทั้งหมด" แบ่งเป็น ปิดประเด็นแล้ว / กำลังดำเนินการ / รอติดตาม / ไม่พบปัญหา */
  const zone13Stats = ZONE_MASTER.map(zm => {
    const zRows = all.filter(r => canonZone(r.zone, r.area, r.entryType) === zm.id);
    const zAb = zRows.filter(r => r.result === "ab");
    const c = zAb.filter(r => st(r) === CLOSED).length;
    const p = zAb.filter(r => st(r) === PROG).length;
    const w = zAb.filter(r => st(r) === WAIT).length;
    const ok = zRows.length - zAb.length;
    return {id:zm.id, pts:zm.pts, points:zm.points, rows:zAb, allRows:zRows, tot:zRows.length, ok, ab:zAb.length, c, p, w};
  });
  const extraRows = all.filter(r => !isMasterZone(canonZone(r.zone, r.area, r.entryType)));
  const extraAb = extraRows.filter(r => r.result === "ab");
  const extraC = extraAb.filter(r => st(r) === CLOSED).length;
  const extraP = extraAb.filter(r => st(r) === PROG).length;
  const extraW = extraAb.filter(r => st(r) === WAIT).length;
  const extraOk = extraRows.length - extraAb.length;

  const zMax = Math.max(1, ...zone13Stats.map(z => z.tot));
  const progBadgeHtml = (p, w) => {
    const chips = [];
    if (p > 0) chips.push(`<span style="display:inline-block;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--prog) 16%,transparent);color:var(--prog);font-weight:700">กำลัง ${p}</span>`);
    if (w > 0) chips.push(`<span style="display:inline-block;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--wait) 16%,transparent);color:var(--wait);font-weight:700">รอ ${w}</span>`);
    return chips.length ? `<div class="text-[10px] leading-tight mt-0.5 flex flex-col items-center gap-0.5">${chips.join("")}</div>` : `<div class="text-[10px] leading-tight mt-0.5" style="color:var(--muted)">กำลัง 0</div>`;
  };
  const zone13ChartHtml = `<div class="cols" style="min-height:214px;gap:.55rem;padding-top:1.35rem">
    ${zone13Stats.map(z => {
      const hPx = z.tot ? Math.max(10, Math.round(z.tot / zMax * 116)) : 4;
      const active = openZones.has(z.id);
      const tip = `${z.id}: ตรวจทั้งหมด ${z.tot} (พบปัญหา ${z.ab}: ปิด ${z.c} · กำลังดำเนินการ ${z.p} · รอติดตาม ${z.w} | ไม่พบปัญหา ${z.ok}) — คลิกดูรายการ`;
      return `<button type="button" class="col-b" data-act="zonetoggle" data-z="${z.id}" style="cursor:pointer;background:none;border:0;padding:0" title="${esc(tip)}">

  const headHtml = `<div class="flex flex-wrap items-end justify-between gap-2"><div><div class="dh1">รายงานสรุปสถิติผลตรวจเวรวันหยุด</div><div class="text-sm" style="color:var(--muted)">บริษัท ไอ-เทล คอร์ปอเรชั่น จำกัด (มหาชน) · โครงสร้างมาตรฐาน ${TOTAL_ZONES} Zone (${TOTAL_POINTS} จุดตรวจ)</div></div><div class="text-sm" style="text-align:right">ช่วงเวลา: <b>${key === "ALL" ? "ทุกช่วง" : esc(perLabel(key, per))}</b><br><span data-exp style="color:var(--muted)"></span></div></div>`;
  const opts = `<option value="ALL" ${key === "ALL" ? "selected" : ""}>ทุกช่วง (ทั้งหมด)</option>` + keys.map(k2 => `<option value="${k2}" ${k2 === key ? "selected" : ""}>${esc(perLabel(k2, per))}</option>`).join(""), ki = keys.indexOf(key);

  return `<div id="dashCap" class="dcap"><section class="card p-4 mb-4 no-cap"><div class="flex flex-wrap items-center justify-between gap-3">

      <div class="flex items-center gap-2"><button class="btn2" data-act="statnav" data-dir="-1" aria-label="ช่วงก่อนหน้า" ${ki < 0 || ki >= keys.length - 1 ? "disabled" : ""}>◀</button><select id="statSel" class="inp" style="width:auto;min-width:12rem" aria-label="เลือกช่วงเวลา">${opts}</select><button class="btn2" data-act="statnav" data-dir="1" aria-label="ช่วงถัดไป" ${ki <= 0 ? "disabled" : ""}>▶</button>${expBtn}</div></div>
    <p class="text-xs mt-2" style="color:var(--muted)">กำลังแสดง: <b>${key === "ALL" ? "ทุกช่วง" : esc(perLabel(key, per))}</b> · อ้างอิงมาตรฐาน ${TOTAL_ZONES} โซน (${TOTAL_POINTS} จุดตรวจ · ตรวจแล้ว ${ptsCheckedCount} รายการใน 13 Zone · นอก Zone ${extraAll.length} รายการ)</p></section>
  <div class="dblk" id="dblk1"><div class="cap-only dhead">${headHtml}</div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
      ${kpi("#4f63d2", "📋", abn.length, "รายการตรวจพบปัญหาทั้งหมด", "")}
      ${kpi("#2f855a", "✅", closed, "ปิดประเด็นแล้ว", `${pct(closed, abn.length)}% ของรายการปัญหา`)}
      ${kpi("#b7791f", "⏳", openCount, "อยู่ระหว่างติดตาม", `รอติดตาม ${wait} · กำลังดำเนินการ ${prog}`)}
      ${ring}

  <div class="dblk" id="dblk2"><section class="card p-4 mb-4">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
      <h2 class="font-semibold">สรุปจำนวนที่ตรวจสอบแยกตาม 13 Zone ตามผลตรวจและสถานะ</h2>
      <span class="text-xs no-cap" style="color:var(--muted)">ยอดตรวจทั้งหมด (Z1–Z13 · 49 จุดตรวจ) · คลิกแท่งเพื่อดูรายการ</span>
    </div>
    ${legendFull}${zone13ChartHtml}${selectedZoneDetailHtml}${typePanelHtml}

    <section class="card p-4"><div class="flex flex-wrap items-center justify-between gap-2"><h2 class="font-semibold">แนวโน้มรายการที่พบ — ${trendTitle}</h2><div class="legend"><span><i style="background:var(--wait)"></i>ค้าง</span><span><i style="background:var(--done)"></i>ปิดแล้ว</span></div></div>${trend}</section></div></div></div>

    <div class="flex flex-wrap items-center gap-2"><select id="tDateSel" class="inp" style="width:auto;min-width:11rem" aria-label="กรองวันที่ตรวจ"><option value="">ทุกวันที่ตรวจ</option>${dates.map(d => `<option value="${d}" ${d === tDate ? "selected" : ""}>${fmtD(d)}</option>`).join("")}</select>
    <button class="btn2 text-xs" data-act="sortdir">${tSort === "date" && sortAsc ? "เก่า → ใหม่ ▲" : "ใหม่ → เก่า ▼"}</button></div></div>
    <div class="flex flex-wrap gap-2 mb-3" role="group" aria-label="กรองสถานะ">${chipsF}</div>${table}</section>`;

/* ===== เหตุการณ์ ===== */
const V = $("#view");
V.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "expmenu" || a === "dexp") e.stopPropagation();
  const r = b.dataset.id && recs.find(x => x.id === b.dataset.id);
  if (a === "day") { const d = b.dataset.d; openDays.has(d) ? openDays.delete(d) : openDays.add(d); animNext = true; }
  else if (a === "cardtoggle") { const id = b.dataset.id; openCards.has(id) ? openCards.delete(id) : openCards.add(id); }
  else if (a === "zonetoggle") { const z = b.dataset.z; openZones.has(z) ? openZones.delete(z) : openZones.add(z); }
  else if (a === "typemode") { typeMode = b.dataset.m; }
  else if (a === "daydel") {
    const d = b.dataset.d, list = recs.filter(x => x.date === d), nab = list.filter(x => x.result === "ab").length;
    if (!await ask(`ลบข้อมูลวันที่ ${fmtD(d)} ทั้งหมด ${list.length} รายการ (พบปัญหา ${nab} รายการ)?${fdb ? " ข้อมูลบน Firebase จะถูกลบและหายจากทุกเครื่อง" : ""} วันที่อื่นไม่ถูกกระทบ`)) return;
    recs = recs.filter(x => x.date !== d); openDays.delete(d); toast(`ลบข้อมูลวันที่ ${fmtD(d)} แล้ว (${list.length} รายการ)`);
  }
  else if (a === "dateedit") editDate = b.dataset.d;
  else if (a === "datecancel") editDate = null;
  else if (a === "datesave") {
    const d = b.dataset.d, nv = $("#dateIn").value;
    if (!nv) return toast("กรุณาเลือกวันที่");
    if (nv !== d) { recs.forEach(x => { if (x.date === d) x.date = nv; }); if (openDays.delete(d)) openDays.add(nv); toast(`เปลี่ยนวันที่เป็น ${fmtD(nv)} แล้ว (เลขที่ใบงานคงเดิม)`); }
    editDate = null;
  }
  else if (a === "pt") { const k = b.dataset.k; openPts.has(k) ? openPts.delete(k) : openPts.add(k); }
  else if (a === "per") { per = b.dataset.p; statKey = ""; }
  else if (a === "sortdir") { tSort === "date" ? sortAsc = !sortAsc : (tSort = "date", sortAsc = false); }
  else if (a === "tsort") { const k = b.dataset.k; tSort === k ? sortAsc = !sortAsc : (tSort = k, sortAsc = false); }
  else if (a === "tstatus") tStatus = b.dataset.k;
  else if (a === "expmenu") { expMenu = !expMenu; render(); return; }
  else if (a === "dexp") { const k = b.dataset.k; expMenu = false; render(); setTimeout(() => doExport(k), 0); return; }
  else if (a === "gotoday") { document.querySelector(`[data-dayhdr="${b.dataset.d}"]`)?.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  else if (a === "statnav") { const ks = statKeys(), i = ks.indexOf(statKey && statKey !== "ALL" ? statKey : ks[0]), j = i - (+b.dataset.dir); if (j >= 0 && j < ks.length) statKey = ks[j]; }
  else if (a === "gotoissue") { view = "day"; openDays.add(b.dataset.d); openCards.add(b.dataset.id); animNext = true; setTimeout(() => document.querySelector(`article[data-id="${b.dataset.id}"]`)?.scrollIntoView({block:"center"}), 80); }
